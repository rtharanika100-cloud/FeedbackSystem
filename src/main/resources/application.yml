spring:
  profiles:
    active: local
  application:
    name: feedback-workflow
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://db.akkskcrvczejklbshmsc.supabase.co:5432/postgres}
    username: ${DATABASE_USERNAME:postgres}
    password: ${SUPABASE_SECRET_KEY:your_supabase_secret_key_here}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

server:
  port: ${PORT:3000}

app:
  jwt:
    secret: ${JWT_SECRET:your_jwt_secret_here_must_be_at_least_256_bits_long_for_security}


